<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Downloader Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top, #1e3a8a, #0f172a);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }

        .ios-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ios-input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
        }

        .btn-ios {
            background: #3b82f6;
            border-radius: 14px;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .btn-ios:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        .tab-active {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="w-full max-w-lg">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight">Downloader</h1>
            <p class="text-blue-200 opacity-70">Premium Media Saver</p>
        </div>

        <div class="glass-card p-2 mb-6 flex justify-between text-sm">
            <button onclick="switchTab('tiktok')" id="tab-tiktok" class="flex-1 py-2 tab-active">
                <i class="fab fa-tiktok mr-1"></i> TikTok
            </button>
            <button onclick="switchTab('instagram')" id="tab-instagram" class="flex-1 py-2">
                <i class="fab fa-instagram mr-1"></i> Instagram
            </button>
            <button onclick="switchTab('youtube')" id="tab-youtube" class="flex-1 py-2">
                <i class="fab fa-youtube mr-1"></i> YT MP3
            </button>
        </div>

        <div class="glass-card p-6 shadow-2xl">
            <div class="mb-5">
                <label id="label-input" class="block text-xs font-medium uppercase tracking-wider text-blue-300 mb-2 ml-1">TikTok URL</label>
                <input type="text" id="url-input" placeholder="Tempel tautan di sini..." class="w-full ios-input px-4 py-4 text-white placeholder-blue-300/50">
            </div>

            <button onclick="processDownload()" id="download-btn" class="w-full btn-ios py-4 flex items-center justify-center space-x-2 shadow-lg shadow-blue-500/20">
                <span>Mulai Unduh</span>
                <i class="fas fa-arrow-down"></i>
            </button>

            <div id="loader" class="hidden mt-6 flex justify-center">
                <div class="loading-spinner"></div>
            </div>

            <div id="result" class="hidden mt-8 space-y-4 animate-in fade-in duration-500">
                <div class="h-px bg-white/10 w-full mb-6"></div>
                <div id="result-content" class="space-y-3"></div>
            </div>
        </div>

        <p class="text-center mt-8 text-xs text-blue-300/40">© 2026 HM MODZ PROJECT</p>
    </div>

    <script>
        let currentType = 'tiktok';
        const endpoints = {
            tiktok: 'https://api.sxtream.my.id/downloader/tiktok',
            instagram: 'https://api.sxtream.my.id/downloader/instagram',
            youtube: 'https://api.sxtream.my.id/downloader/ytmp3'
        };

        function switchTab(type) {
            currentType = type;
            document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.remove('tab-active'));
            document.getElementById(`tab-${type}`).classList.add('tab-active');
            
            const labels = {
                tiktok: 'TikTok URL',
                instagram: 'Instagram URL',
                youtube: 'YouTube URL'
            };
            document.getElementById('label-input').innerText = labels[type];
            document.getElementById('result').classList.add('hidden');
        }

        async function processDownload() {
            const url = document.getElementById('url-input').value;
            const btn = document.getElementById('download-btn');
            const loader = document.getElementById('loader');
            const resultDiv = document.getElementById('result');
            const resultContent = document.getElementById('result-content');

            if (!url) return alert('Masukkan URL terlebih dahulu!');

            btn.disabled = true;
            btn.style.opacity = '0.5';
            loader.classList.remove('hidden');
            resultDiv.classList.add('hidden');

            try {
                const response = await fetch(`${endpoints[currentType]}?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                if (data.status) {
                    resultContent.innerHTML = '';
                    
                    if (currentType === 'tiktok') {
                        createDownloadButton('Video (Tanpa Watermark)', data.result.video, 'fa-video');
                        createDownloadButton('Audio Only (MP3)', data.result.audio, 'fa-music');
                    } else if (currentType === 'instagram') {
                        createDownloadButton('Unduh Video Instagram', data.result.url, 'fa-instagram');
                    } else if (currentType === 'youtube') {
                        createDownloadButton('Unduh MP3', data.result.url, 'fa-headphones');
                    }
                    
                    resultDiv.classList.remove('hidden');
                } else {
                    alert('Gagal mengambil data. Pastikan URL benar.');
                }
            } catch (error) {
                alert('Terjadi kesalahan koneksi ke server.');
            } finally {
                btn.disabled = false;
                btn.style.opacity = '1';
                loader.classList.add('hidden');
            }
        }

        function createDownloadButton(text, link, icon) {
            const container = document.getElementById('result-content');
            const a = document.createElement('a');
            a.href = link;
            a.target = '_blank';
            a.className = 'flex items-center justify-between w-full p-4 ios-input hover:bg-white/20 transition-all';
            a.innerHTML = `
                <div class="flex items-center">
                    <div class="w-10 h-10 rounded-full bg-blue-500/20 flex items-center justify-center mr-3">
                        <i class="fas ${icon} text-blue-400"></i>
                    </div>
                    <span class="text-sm font-medium">${text}</span>
                </div>
                <i class="fas fa-chevron-right text-white/30 text-xs"></i>
            `;
            container.appendChild(a);
        }
    </script>
</body>
</html>
